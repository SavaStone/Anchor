name: Bug report
description: Report a problem using fictional data
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not attach medical records, passwords, personal database copies or raw logs.
        Send vulnerabilities privately to savastone32@proton.me, not to Issues.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.0.1-beta, build 4
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android version and device model
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use fictional data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
